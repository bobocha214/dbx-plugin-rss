name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            artifact: rss-windows-x64
          - os: ubuntu-latest
            target: linux-x64
            artifact: rss-linux-x64
          - os: macos-15-intel
            target: darwin-x64
            artifact: rss-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check versions
        shell: pwsh
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.1.0') { throw 'Expected fixed version 0.1.0' }
          if ((Get-Content backend/main.go -Raw) -notmatch ('pluginVersion\s*=\s*"' + [regex]::Escape($version) + '"')) {
            throw 'Go backend version does not match manifest'
          }
          if ((Get-Content ui/index.html -Raw) -notmatch ('>v' + [regex]::Escape($version) + '</span>')) {
            throw 'UI version does not match manifest'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match manifest version: v$version"
          }
      - name: Test
        shell: pwsh
        run: |
          go -C backend test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C backend vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/ui.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install DBX plugin CLI
        run: npm install --global @dbx-app/plugin-cli@0.1.6
      - name: Package
        run: dbx-plugin package . --target ${{ matrix.target }} --output-dir dist
      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist/*.dbxp | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS-${{ matrix.target }}.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.dbxp
            dist/*.artifact.json
            dist/SHA256SUMS-*.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rss-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes
